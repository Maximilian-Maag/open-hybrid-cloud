name: CI

on:
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless, so
# stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Type-check & Lint ────────────────────────────────────────────────────────
  check:
    name: Type-check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Type-check types package
        run: pnpm --filter @open-hybrid-cloud/types exec tsc --noEmit

      - name: Type-check backend
        run: pnpm --filter backend exec tsc --noEmit

      - name: Type-check frontend
        run: pnpm --filter frontend exec tsc --noEmit

      - name: Lint backend
        run: pnpm --filter backend lint

      - name: Lint frontend
        run: pnpm --filter frontend lint

  # ── Test ─────────────────────────────────────────────────────────────────────
  #
  # One leg per app, so the seven-minute backend suite and the twenty-second
  # frontend one stop being the same seven and a half minutes. Only the backend
  # leg needs a database.
  test-matrix:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      # A frontend failure should not cancel the backend leg: knowing about both
      # is the point of splitting them.
      fail-fast: false
      matrix:
        app: [backend, frontend]
    services:
      # Present for both legs because a service block cannot be conditional per
      # matrix leg. The frontend suite ignores it, and an unused Postgres costs a
      # few seconds of startup — cheaper than hand-rolling `docker run` to avoid
      # it. The test database tunes itself for durability-free speed (see
      # src/test/database.ts), so nothing is needed on the server's command line.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_hybrid_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Test ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} test

  # The name branch protection knows. It stays green/red with the legs, so the
  # matrix can be reshaped without touching the protection rules.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [test-matrix]
    if: always()
    steps:
      - name: Report the matrix result
        run: |
          echo "test-matrix: ${{ needs.test-matrix.result }}"
          [ "${{ needs.test-matrix.result }}" = "success" ]

  # ── Build ────────────────────────────────────────────────────────────────────
  #
  # No longer behind `test`: a build failure is not caused by a test failure, and
  # learning about both at once beats learning about them in sequence.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build backend
        run: pnpm --filter backend build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_hybrid_cloud

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-build-placeholder-not-used-at-runtime
          API_URL: http://localhost:3001

  # ── E2E ──────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_hybrid_cloud_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_hybrid_cloud_e2e
      JWT_SECRET: ci-e2e-jwt-secret-not-used-in-prod
      ADMIN_EMAIL: root@test.dev
      ADMIN_PASSWORD: testpassword123
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-e2e-nextauth-secret-not-used-in-prod
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      E2E_BASE_URL: http://localhost:3000
      E2E_ADMIN_EMAIL: root@test.dev
      E2E_ADMIN_PASSWORD: testpassword123
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test --grep-invert "Accessibility"

      # Separate step so a red pipeline says which of the two broke. Covers
      # WCAG 2.1 A/AA on every page and dialog, plus the things axe cannot see:
      # focus visibility, accessible-name language, aria-current and
      # reduced-motion. Also re-scans the dashboard under a deliberately hostile
      # branding colour, because the chrome is painted on an operator-chosen
      # value and default-config scanning hid 235 of 246 failures.
      - name: Run accessibility gate (WCAG 2.1 AA)
        run: pnpm exec playwright test e2e/a11y.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

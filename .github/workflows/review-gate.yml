name: Automated review

# A green check that means "did not look" is worse than a missing one, because it
# reads as coverage (#92). CodeRabbit reported **pass** on #84 ("134 files exceed
# the limit of 100"), on #85 ("Review rate limited") and again on #123 ("Review
# rate limited") — three PRs where nothing reviewed the diff and nothing said so.
#
# This cannot be a step in the CI workflow: CI finishes in minutes and the review
# arrives afterwards, so a check that ran with the build would always pass. It is
# a separate workflow that waits, then asks what actually happened.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-happened:
    name: An automated review actually ran
    runs-on: ubuntu-latest
    # The job polls and exits as soon as a review lands, so it normally finishes
    # in a minute or two. The ceiling only matters when nothing ever answers.
    timeout-minutes: 20
    steps:
      - name: Wait for a review of THIS head, then judge it
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # The commit under review. Activity against an earlier head does not
          # count: a stale review passing a freshly pushed diff is the exact
          # failure this gate exists to prevent.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEADLINE_SECONDS: 900
          POLL_SECONDS: 30
        run: |
          set -euo pipefail

          deadline=$(( SECONDS + DEADLINE_SECONDS ))
          skipped=0
          api_failures=0

          # A bot review, or an inline comment from a bot, on this exact commit.
          # `--paginate --jq` emits one value per page, so emit a stream and slurp.
          bot='(.user.type == "Bot" or (.user.login | test("coderabbit|copilot"; "i")))'

          while :; do
            ok=1
            reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq ".[] | select($bot) | select(.commit_id == \"$HEAD_SHA\") | {login: .user.login, body: (.body // \"\")}" \
              | jq -s '.') || ok=0
            inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate \
              --jq ".[] | select($bot) | select(.commit_id == \"$HEAD_SHA\" or .original_commit_id == \"$HEAD_SHA\") | .id" \
              | jq -s 'length') || ok=0

            if [ "$ok" -eq 0 ]; then
              # An unreachable API is not the same as an unreviewed diff. Count it,
              # keep waiting, and say so at the end rather than blaming the reviewer.
              api_failures=$(( api_failures + 1 ))
              echo "::warning::GitHub API call failed (attempt $api_failures); not treating that as 'no review'."
            else
              substantive=$(echo "$reviews" | jq '[.[] | select((.body | test("review skipped|rate limited|exceed the limit of"; "i")) | not) | select(.body | length > 200)] | length')
              skipped=$(echo "$reviews" | jq '[.[] | select(.body | test("review skipped|rate limited|exceed the limit of"; "i"))] | length')

              if [ "$substantive" -gt 0 ] || [ "$inline" -gt 0 ]; then
                echo "$reviews" | jq -r '.[] | "  \(.login): \(.body[0:100] | gsub("\n"; " "))"'
                echo "::notice::An automated review ran on ${HEAD_SHA:0:8} ($substantive review(s), $inline inline comment(s))."
                exit 0
              fi
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi

            echo "nothing on ${HEAD_SHA:0:8} yet (skips: $skipped, api failures: $api_failures) — $(( (deadline - SECONDS) / 60 ))m left"
            sleep "$POLL_SECONDS"
          done

          if [ "$skipped" -gt 0 ]; then
            echo "$reviews" | jq -r '.[] | "  \(.login): \(.body[0:200] | gsub("\n"; " "))"'
            echo "::error::A reviewer explicitly skipped this diff (rate limit or file cap) and nothing else reviewed it. Split the PR, wait for the quota, or review it by hand and say so in a comment."
            exit 1
          fi

          if [ "$api_failures" -gt 0 ]; then
            echo "::error::Could not establish whether ${HEAD_SHA:0:8} was reviewed — $api_failures GitHub API call(s) failed. This is an infrastructure failure, not a review failure; re-run the job."
            exit 1
          fi

          echo "::error::No automated review of ${HEAD_SHA:0:8} appeared within $(( DEADLINE_SECONDS / 60 )) minutes. Do not read the other green checks as \"reviewed\"."
          exit 1

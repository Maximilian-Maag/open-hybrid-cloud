name: Automated review

# A green check that means "did not look" is worse than a missing one, because it
# reads as coverage (#92). CodeRabbit reported **pass** on #84 ("134 files exceed
# the limit of 100"), on #85 ("Review rate limited") and again on #123 ("Review
# rate limited") — three PRs where nothing reviewed the diff and nothing said so.
#
# This cannot be a step in the CI workflow: CI finishes in minutes and the review
# arrives afterwards, so a check that ran with the build would always pass. It is
# a separate workflow that waits, then asks what actually happened.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-happened:
    name: An automated review actually ran
    runs-on: ubuntu-latest
    # The job polls and exits as soon as a review lands, so it normally finishes
    # in a minute or two. The ceiling only matters when nothing ever answers.
    timeout-minutes: 20
    steps:
      - name: Wait for a review, then judge it
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # How long a reviewer gets before silence counts as an answer. A
          # reviewer that has not spoken in fifteen minutes has either skipped the
          # diff or is not coming.
          DEADLINE_SECONDS: 900
          POLL_SECONDS: 30
        run: |
          set -euo pipefail

          deadline=$(( SECONDS + DEADLINE_SECONDS ))
          skipped=0

          while :; do
            # Reviews and inline comments both count. CodeRabbit posts its summary
            # as a review, Copilot likewise, and a review with findings but no
            # summary body is still a review.
            # `--paginate --jq` emits one value per page, so asking for an array
            # yields several arrays and nothing downstream can parse it. Emit a
            # stream of objects and slurp it into one array with `jq -s`.
            reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '.[] | select(.user.type == "Bot" or (.user.login | test("coderabbit|copilot"; "i"))) | {login: .user.login, body: (.body // "")}' \
              | jq -s '.' || echo '[]')
            # Same reason: count the ids, do not sum per-page lengths.
            inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq '.[].id' | wc -l || echo 0)

            substantive=$(echo "$reviews" | jq '[.[] | select((.body | test("review skipped|rate limited|exceed the limit of"; "i")) | not) | select(.body | length > 200)] | length')
            skipped=$(echo "$reviews" | jq '[.[] | select(.body | test("review skipped|rate limited|exceed the limit of"; "i"))] | length')

            if [ "$substantive" -gt 0 ] || [ "$inline" -gt 0 ]; then
              echo "$reviews" | jq -r '.[] | "  \(.login): \(.body[0:100] | gsub("\n"; " "))"'
              echo "::notice::An automated review ran on this diff ($substantive review(s), $inline inline comment(s))."
              exit 0
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi

            echo "no review yet (skipped notices: $skipped) — waiting ${POLL_SECONDS}s, $(( (deadline - SECONDS) / 60 ))m left"
            sleep "$POLL_SECONDS"
          done

          # Deadline reached with nothing substantive. Which of the two failures it
          # is changes what the author should do about it.
          if [ "$skipped" -gt 0 ]; then
            echo "$reviews" | jq -r '.[] | "  \(.login): \(.body[0:200] | gsub("\n"; " "))"'
            echo "::error::A reviewer explicitly skipped this diff (rate limit or file cap) and nothing else reviewed it. Split the PR, wait for the quota, or review it by hand and say so in a comment."
            exit 1
          fi

          echo "::error::No automated review appeared within $(( DEADLINE_SECONDS / 60 )) minutes. Do not read the other green checks as \"reviewed\"."
          exit 1

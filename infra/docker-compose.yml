# Docker host deployment — connects to real external systems via env vars.
# Configure infra/docker-host/.env before starting — backend, frontend and
# postgres all read it via env_file. (nginx takes no environment.)
# Start with: docker compose -f infra/docker-compose.yml up -d

services:

  # ── Application ───────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    container_name: infrashelf-frontend
    env_file: ./docker-host/.env
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: infrashelf-backend
    env_file: ./docker-host/.env
    expose:
      - "3001"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Reverse proxy ─────────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: infrashelf-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  # ── Database ──────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: infrashelf-postgres
    env_file: ./docker-host/.env
    environment:
      POSTGRES_DB: infrashelf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infrashelf"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
    driver: bridge

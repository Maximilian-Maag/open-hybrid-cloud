# Production deployment on a single Docker host.
# Prerequisites:
#   - docker login (to pull images from Docker Hub)
#   - .env filled in (see .env.example)
#   - SERVER_NAME in .env (nginx.conf.template is mounted, never copied)
#   - TLS certificates in ./certs/ (fullchain.pem + privkey.pem)

services:

  # ── Reverse proxy ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: open-hybrid-cloud-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The one host-specific value in the template. It must match NEXTAUTH_URL
      # and the name on the certificate.
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME must be your public domain, e.g. hcp.example.com}
      # Where the image writes the rendered template. Default is conf.d, which is
      # included from inside `http` — this template IS the whole nginx.conf.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      # Substitute SERVER_NAME and nothing else. Without the filter, envsubst
      # also eats $$host, $$scheme, $$remote_addr and the upstream variables, and
      # nginx cannot parse what comes out.
      NGINX_ENVSUBST_FILTER: "^SERVER_NAME$$"
    volumes:
      # Mounted as a TEMPLATE, so the deployed config is this repository's file
      # and cannot drift from it. See the header of nginx.conf.template for the
      # outage that made this necessary.
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Next.js UI) ──────────────────────────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME}/open-hybrid-cloud-frontend:${IMAGE_TAG:?IMAGE_TAG must be set to the release you intend to run}
    container_name: open-hybrid-cloud-frontend
    expose:
      - "3000"
    environment:
      NEXTAUTH_URL: "${NEXTAUTH_URL}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      # Server-side URL for frontend → backend communication (internal network)
      API_URL: "http://backend:3001"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    # node:22-alpine has no curl — busybox wget is what's actually available.
    healthcheck:
      # 127.0.0.1, not localhost: this image's `localhost` resolves to ::1, but
      # the server only binds the IPv4 0.0.0.0 (HOSTNAME=0.0.0.0 above).
      # /api/ping, not /: unauthenticated requests to / redirect to NEXTAUTH_URL
      # (https://<public-domain>/login) and wget follows redirects, so it would
      # hit the same ::1 problem again trying to reach the *public* origin.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Next.js API) ──────────────────────────────────────────────────────
  backend:
    image: ${DOCKERHUB_USERNAME}/open-hybrid-cloud-backend:${IMAGE_TAG:?IMAGE_TAG must be set to the release you intend to run}
    container_name: open-hybrid-cloud-backend
    expose:
      - "3001"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/open_hybrid_cloud"
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      # Encrypts the root account's TOTP secret at rest. Blank derives it from
      # JWT_SECRET — see ../../.env.example.
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:-}"
      FRONTEND_URL: "${NEXTAUTH_URL}"
      EXCHANGE_RATE_API_URL: "${EXCHANGE_RATE_API_URL}"
      # Optional — SMTP. Leave blank to disable email.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_TLS: "${SMTP_TLS:-true}"
      # Optional — encrypts the integration registry's credentials (issue #111).
      # Blank leaves the feature off; it never falls back to plain text.
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:-}"
      # Optional — enables POST /api/internal/decommission-sweep. Blank leaves it
      # disabled (503), and a scheduled decommission then stays a stored
      # timestamp nothing ever acts on. This deployment has no scheduler of its
      # own: point cron or a systemd timer at the endpoint (see ../../.env.example).
      DECOMMISSION_SWEEP_SECRET: "${DECOMMISSION_SWEEP_SECRET:-}"
      # Optional — enables the scheduled drift loop (issue #108). Authorises BOTH
      # GET /api/internal/drift-targets and POST /api/internal/drift-report;
      # blank leaves both disabled (503). The reporter is a pipeline schedule in
      # the infra-templates project, which needs the same value.
      DRIFT_REPORT_SECRET: "${DRIFT_REPORT_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: this image's `localhost` resolves to ::1, but
      # the server only binds the IPv4 0.0.0.0 (HOSTNAME=0.0.0.0 above).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Database ───────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: open-hybrid-cloud-postgres
    environment:
      POSTGRES_DB: open_hybrid_cloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Auto-updater ───────────────────────────────────────────────────────────────
  watchtower:
    # 1.7.1, the version running on the dev host. Watchtower is the component
    # that PULLS new images, so leaving it on a floating tag means the thing
    # deciding what to update is itself updated without anyone deciding (#180).
    image: containrrr/watchtower:1.7.1
    container_name: open-hybrid-cloud-watchtower
    environment:
      DOCKER_API_VERSION: "1.47"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: --cleanup --interval 300 --label-enable
    restart: unless-stopped

volumes:
  postgres_data:

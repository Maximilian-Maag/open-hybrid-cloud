# ── Frontend ──────────────────────────────────────────────────────────────────
frontend:
  replicaCount: 2

  image:
    repository: your-dockerhub-username/open-hybrid-cloud-frontend
    pullPolicy: IfNotPresent
    # Overrides Chart.appVersion when set
    tag: ""

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  env:
    nextauthUrl: "https://shop.example.com"
    # NEXT_PUBLIC_API_URL is baked in at build time; set via build args.
    # Runtime server-side API URL (container-internal)
    apiUrl: "http://open-hybrid-cloud-backend:3001"

  # Secrets — provide via --set or a separate secrets values file
  secrets:
    nextauthSecret: ""    # NEXTAUTH_SECRET  32+ random bytes

# ── Scheduled decommissioning (issue #30) ─────────────────────────────────────
# Drives POST /api/internal/decommission-sweep, which tears down infrastructure
# whose scheduled_decommission_at has arrived.
#
# A CronJob rather than a timer inside the backend: the backend is horizontally
# scaled (see backend.autoscaling), so an in-process interval would run once per
# replica. The sweep is safe either way — its active → decommissioning claim is
# atomic, so overlapping runs cannot double-destroy — but one caller is enough.
#
# `schedule` is the granularity of the feature: an element is torn down at the
# first sweep at or after its scheduled time, not to the second.
decommissionSweep:
  enabled: false
  schedule: "*/15 * * * *"
  # Shared secret sent as X-Sweep-Secret. Required when enabled; the endpoint
  # stays disabled (503) while unset, so it can never be called anonymously.
  secret: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ── Backend ───────────────────────────────────────────────────────────────────
backend:
  replicaCount: 2

  image:
    repository: your-dockerhub-username/open-hybrid-cloud-backend
    pullPolicy: IfNotPresent
    # Overrides Chart.appVersion when set
    tag: ""

  service:
    type: ClusterIP
    port: 3001

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  env:
    adminEmail: "admin@example.com"
    frontendUrl: "https://shop.example.com"
    exchangeRateApiUrl: "https://api.exchangerate.host/latest"

    # Optional — Microsoft Entra ID (OIDC)
    entra:
      tenantId: ""
      clientId: ""
      clientSecret: ""

    # Optional — SMTP
    smtp:
      host: ""
      port: "587"
      from: ""
      user: ""
      pass: ""
      tls: "true"

  # Secrets — provide via --set or a separate secrets values file
  secrets:
    databaseUrl: ""     # DATABASE_URL  postgresql://user:pass@host:5432/db
    jwtSecret: ""       # JWT_SECRET    32+ random bytes
    adminPassword: ""   # ADMIN_PASSWORD  initial admin account password
    # SECRET_ENCRYPTION_KEY — 64 hex characters (`openssl rand -hex 32`). Encrypts
    # the credentials in the integration registry (Foreman, Ansible, Nexus, Pulp,
    # Loki, Grafana). Leave empty to leave that feature off; the endpoints then
    # refuse to store a credential rather than storing it in plain text.
    #
    # Cannot currently be rotated: a new key cannot decrypt what the old one
    # wrote, and every stored credential would have to be re-entered.
    secretEncryptionKey: ""
    # TOTP_ENCRYPTION_KEY — encrypts the root account's second-factor secret at
    # rest. 32 bytes, hex or base64: `openssl rand -base64 32`. Blank derives it
    # from jwtSecret, which works but means rotating jwtSecret invalidates every
    # enrolled authenticator.
    totpEncryptionKey: ""

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: shop.example.com
  tls:
    - secretName: open-hybrid-cloud-tls
      hosts:
        - shop.example.com

# ── Database migration hook ───────────────────────────────────────────────────
migrate:
  # Run as a pre-install / pre-upgrade Helm hook via the backend image
  enabled: true

# ── Pod configuration (shared defaults) ──────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

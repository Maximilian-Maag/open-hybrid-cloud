# Docker's embedded DNS. Needed so nginx re-resolves upstream hostnames instead
# of caching the first IP forever — otherwise every container restart leaves
# nginx pointing at the pre-restart IP and every request returns 502 until
# nginx itself is restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Match MAX_IMAGE_BYTES in the backend (10 MiB, apps/backend/src/lib/services/
    # admin/products.ts). Without this nginx applies its 1 MB default and rejects a
    # legitimate 2 MB product image before it reaches the app that allows it, and
    # an oversized body would otherwise be buffered by the route's formData() call
    # rather than refused at the edge. The docker-host example and the Helm ingress
    # already set the same limit; this file was the one that did not.
    client_max_body_size 10M;

    # Increase buffer sizes for Next.js SSR responses
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # Upstream hostnames held in variables → runtime DNS re-resolution.
    set $frontend_upstream "frontend:3000";
    set $backend_upstream  "backend:3001";

    # ── API routes → backend ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # ── All other routes → frontend ───────────────────────────────────────────
    location / {
        proxy_pass         http://$frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js HMR in dev)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
